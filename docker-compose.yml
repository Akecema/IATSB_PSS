services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: pss-iatsb-app
    ports:
      - "8100:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pss_prjt_iatsb_db}
      APP_DEBUG: ${APP_DEBUG:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [pss_iatsb_net]
    restart: unless-stopped

  db:
    image: mariadb:10.4
    container_name: pss-iatsb-db
    # Dump was taken from MariaDB 10.4 and contains zero dates, so keep sql_mode empty.
    command: >
      --sql-mode=""
      --max-allowed-packet=512M
      --innodb-flush-log-at-trx-commit=2
      --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-pss_prjt_iatsb_db}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Imported once, on first start of an empty db_data volume (mounted read-only from the host).
      - ${DUMP_PATH:-E:/SQL/pss_prjt_iatsb_db.sql}:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./docker/initdb/02-local-urls.sql:/docker-entrypoint-initdb.d/02-local-urls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 240
      start_period: 30s
    networks: [pss_iatsb_net]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pss-iatsb-phpmyadmin
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    ports:
      - "8082:80"
    depends_on: [db]
    networks: [pss_iatsb_net]

networks:
  pss_iatsb_net:
    ipam:
      config:
        - subnet: 10.84.84.0/24

volumes:
  db_data:
