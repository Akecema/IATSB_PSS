; Non-Docker hosts (PHP-FPM/CGI): same guard as docker/php.ini. Must be an absolute path - a
; relative one resolves against the REQUESTING SCRIPT's own directory, not the docroot, so it
; silently works for root-level pages and fatals ("Failed opening required 'include/guard.php'")
; for every page one or more folders deep. This assumes the Azure App Service Linux (PHP code-based
; runtime) standard docroot; update it to match if this file is ever deployed somewhere else.
auto_prepend_file = "/home/site/wwwroot/include/guard.php"
