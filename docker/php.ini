; PSS_IATSB PHP overrides.
; APP_DEBUG-driven display_errors is handled separately by
; docker/entrypoint.sh, which writes conf.d/zz-app-debug.ini at boot.

error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = Off
log_errors = On
error_log = /dev/stderr

upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 256M
max_execution_time = 300

; Sessions are used throughout (login). Keep them on local container disk
; by default; mount a volume at /var/lib/php/sessions if you need sessions
; to survive container restarts or to share across replicas.
session.save_path = "/var/lib/php/sessions"

date.timezone = Asia/Kuala_Lumpur

; login.php prints HTML output before calling session_start()/header()
; in some code paths. Output buffering avoids the classic
; "headers already sent" / login-silently-does-nothing failure that every
; sibling project on this migration pattern hit on the stock PHP image
; (which has output_buffering off, unlike traditional shared hosting).
output_buffering = 4096
auto_prepend_file = "/var/www/html/include/guard.php"
session.use_strict_mode = 1
expose_php = Off
