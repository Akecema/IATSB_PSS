ServerName localhost
ServerTokens Prod

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Directories that live inside the docroot (because the app's relative
    # includes assume that layout) but must never be served directly.
    <DirectoryMatch "/var/www/html/(docker|include|tests|jobs|docs|db)">
        Require all denied
    </DirectoryMatch>

    # Any dotfile or dot-directory (.git, .env*, .gitignore, .dockerignore,
    # and anything added later) — blocked generically instead of enumerated,
    # so a new dotfile is safe by default.
    <DirectoryMatch "(^|/)\.[^/]+$">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Docs/config files that also live inside the docroot.
    <FilesMatch "\.(log|md)$">
        Require all denied
    </FilesMatch>


    # Upload folders: never execute PHP from them. Data folders read only by the app are
    # closed to the web; MFO_upload/SA_upload (PDFs linked from pages) and set_upload
    # (logos) stay downloadable.
    <DirectoryMatch "/var/www/html/(BOM_upload|BOM_detail_upload|BOM_update|MAT_upload|MAT_update|MFO_upload|SA_upload|set_upload|FromPortal[0-9]?|PO_PDF|PO_PDF_TEST|aac651b5c6ee/(upload_pps|upload_dikanban|PDIO_upld))">
        <FilesMatch "\.(ph(p[0-9]?|t|tml|ar)|pl|py|cgi|sh)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    <DirectoryMatch "/var/www/html/(BOM_upload|BOM_detail_upload|BOM_update|MAT_upload|MAT_update|FromPortal[0-9]?|aac651b5c6ee/(upload_pps|upload_dikanban|PDIO_upld))">
        Require all denied
    </DirectoryMatch>

    # Unreferenced legacy leftovers: a duplicate of the login page with the old flaws, and a
    # chart-export helper that shell_exec()s request-derived arguments.
    <FilesMatch "^XX_index\.php$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/var/www/html/chart/export-handlers">
        Require all denied
    </DirectoryMatch>

    # Same headers as include/guard.php, for static files PHP never sees.
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty X-Frame-Options "SAMEORIGIN"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    ServerSignature Off

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
